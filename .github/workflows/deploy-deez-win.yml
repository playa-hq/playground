name: deploy deez.win

# Builds the binary in CI (the server has no Go toolchain) and ships it to the
# VPS, mirroring the manual build → scp → systemctl restart flow used by the
# other services on that box.

on:
  push:
    branches: [main]
    paths:
      - 'experiments/deez-win/**'
      - '.github/workflows/deploy-deez-win.yml'
      # Docs and ops notes don't change the binary; don't redeploy for them.
      - '!experiments/deez-win/**.md'
      - '!experiments/deez-win/ops/**'
  workflow_dispatch:
    # Manual dispatch is restricted to main to prevent deploying unvalidated code.
    # The check workflow (formatting, shell syntax, credential scan) only runs on
    # PRs, so a branch that bypasses PR review also bypasses those validations.
    branches: [main]

concurrency:
  # Never let two deploys race for the same binary.
  group: deploy-deez-win
  cancel-in-progress: false

env:
  APP: deez-win
  BINARY: deezwin
  REMOTE_DIR: /opt/deez-win
  SERVICE: deez-win

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/deez-win
    steps:
      - uses: actions/checkout@v4

      - name: Verify deployment from main branch
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::Deployment is only allowed from the main branch. Current ref: ${{ github.ref }}"
            exit 1
          fi
          echo "Verified: deploying from main branch"

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: experiments/deez-win/go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      # Static binary: the server has no Go and we don't want a libc dependency.
      - name: Build
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 \
            go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_SHA::7}" -o "$BINARY" .
          ls -lh "$BINARY"

      - uses: actions/upload-artifact@v4
        with:
          name: deezwin-binary
          path: experiments/deez-win/deezwin
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # A deploy touches a shared production host, so it is gated on an
    # environment: add required reviewers there if you want a human in the loop.
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: deezwin-binary

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Host key is pinned rather than auto-accepted, so a hijacked DNS
          # answer cannot capture the deploy key.
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Upload binary and checksum
        run: |
          chmod +x deezwin
          # The checksum goes first: the deploy script refuses to install a
          # binary whose hash does not match, so a truncated transfer fails
          # loudly instead of producing a SIGBUS crash loop.
          sha256sum deezwin | awk '{print $1"  deezwin.new"}' > deezwin.new.sha256
          cat deezwin.new.sha256
          scp -O -i ~/.ssh/id_ed25519 deezwin \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:$REMOTE_DIR/$BINARY.new"
          scp -O -i ~/.ssh/id_ed25519 deezwin.new.sha256 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:$REMOTE_DIR/$BINARY.new.sha256"

      - name: Swap and restart
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "deez-win-deploy"

      # The authoritative health check is server-side: deez-win-deploy refuses
      # to finish unless the service is active, and rolls back if it is not. This
      # step is the public-facing confirmation on top of that, and is advisory
      # until DNS points at the box.
      - name: Verify publicly reachable
        run: |
          for i in $(seq 1 10); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 https://deez.win/ 2>/dev/null || echo 000)
            if [ "$code" = "200" ]; then
              echo "deez.win is serving"; exit 0
            fi
            echo "attempt $i: got '$code'"; sleep 3
          done
          echo "::warning::deez.win is not publicly reachable yet. The deploy itself succeeded (the service is active, or it would have rolled back). This is expected until the A record points at the host and certbot has issued."
