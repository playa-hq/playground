<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>deez.win · video</title>
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="stylesheet" href="/app.css">
<style>
  .vid-shell { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 12px; box-sizing: border-box; }
  .vid-shell video { width: auto; height: 88vh; max-width: 100%; background: #000; border-radius: 12px; outline: 1px solid rgba(255,255,255,.12); }
  .vid-actions { display: flex; gap: 22px; align-items: center; margin: 0; font-family: 'DM Mono', monospace; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; }
  .vid-actions a { color: inherit; }
  @media (max-width: 700px) { .vid-shell video { width: 100%; height: auto; max-height: 88vh; } }
</style>
</head>
<body>
<main class="vid-shell">
  <video controls playsinline preload="metadata" src="/video/playa.mp4"></video>
  <p class="vid-actions">
    <a href="/video/playa.mp4" download="playa.mp4">⤓ Download</a>
    <a href="/"><img src="/playa-logo.png" alt="deez.win" style="height:36px;vertical-align:middle"></a>
  </p>
</main>
</body>
</html>
