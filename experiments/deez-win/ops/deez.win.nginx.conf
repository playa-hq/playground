# Install to /etc/nginx/sites-available/deez.win, then symlink into
# sites-enabled and run:  certbot --nginx -d deez.win -d www.deez.win
#
# Certbot appends the listen 443 / ssl_certificate lines, exactly as it did for
# codraw.app. This file is the pre-TLS state.

server {
    server_name deez.win www.deez.win;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # The page pulls htmx from unpkg and fonts from Google; everything else is
    # same-origin. Keep this tight — it is the only client-side attack surface.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' unpkg.com; style-src 'self' 'unsafe-inline' fonts.googleapis.com; font-src 'self' fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; media-src 'self'" always;

    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types application/javascript application/json text/css text/html text/plain image/svg+xml;

    # ACME challenges must be served from disk, not proxied to the app —
    # otherwise the Go router answers 404 and certbot renewal fails silently
    # months from now.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8087;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # Generated audio and CSS are immutable between deploys.
    location ~* \.(css|js|wav|mp3|woff2?)$ {
        proxy_pass http://127.0.0.1:8087;
        expires 1h;
        add_header Cache-Control "public";
    }

    listen 80;
    listen [::]:80;
}
