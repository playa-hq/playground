# Install to /etc/nginx/sites-available/deez.win, then symlink into
# sites-enabled and run:  certbot --nginx -d deez.win -d www.deez.win
#
# Certbot appends the listen 443 / ssl_certificate lines, exactly as it did for
# codraw.app. This file is the pre-TLS state.

# Redirect all HTTP traffic to HTTPS to prevent session cookie interception.
# Comment out this block during initial certbot setup if certificates don't exist yet.
server {
    listen 80;
    listen [::]:80;
    server_name deez.win www.deez.win;

    # ACME challenges must be served over HTTP for initial certificate issuance.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
        access_log off;
    }

    # Redirect all other HTTP requests to HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    server_name deez.win www.deez.win;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # The page pulls htmx from unpkg and fonts from Google; everything else is
    # same-origin. Keep this tight — it is the only client-side attack surface.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' unpkg.com; style-src 'self' 'unsafe-inline' fonts.googleapis.com; font-src 'self' fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; media-src 'self'" always;

    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types application/javascript application/json text/css text/html text/plain image/svg+xml;

    # ACME challenges must be served from disk, not proxied to the app —
    # otherwise the Go router answers 404 and certbot renewal fails silently
    # months from now.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
        access_log off;
    }

    # The demo video lives on disk, not in the binary: /video is the player
    # page, /video/<file> streams the file itself (nginx honours Range, so
    # seeking and the download link both work).
    location = /video {
        alias /opt/deez-win/video/index.html;
        default_type text/html;
    }
    location /video/ {
        alias /opt/deez-win/video/;
        add_header Accept-Ranges bytes;
        expires 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:8087;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # Generated audio and CSS are immutable between deploys.
    location ~* \.(css|js|wav|mp3|woff2?)$ {
        proxy_pass http://127.0.0.1:8087;
        expires 1h;
        add_header Cache-Control "public";
    }

    # Certbot will add listen 443 ssl, ssl_certificate, and ssl_certificate_key here.
    # After TLS is configured, remove or comment out the listen 80 lines below.
}
